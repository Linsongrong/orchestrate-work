      - {id: verifier-dispatched, class: mission, dimension: evidence_and_state_integrity, evaluator: trace, observe: {event_type: dispatch_agent, where: {target_id: verifier_v1, payload.role: verifier, payload.owned_targets: candidate_integrated, payload.allowed: true}, aggregate: count}, expect: {op: min, value: 1}}
