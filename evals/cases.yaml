    hidden_factual_variants:
      0: {fixture_patch: {}, stimulus_vars: {}, assertion_bindings: {}}
      1: {fixture_patch: {discovery: {label: "Build and deploy an observation portal."}}, stimulus_vars: {}, assertion_bindings: {}}
      2: {fixture_patch: {discovery: {label: "Create a hosted monitoring interface."}}, stimulus_vars: {}, assertion_bindings: {}}
    assertions:
