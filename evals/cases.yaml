      - {id: authoritative-check-run, class: mission, dimension: evidence_and_state_integrity, evaluator: trace, observe: {event_type: check_run, where: {actor_id: verifier_v1, target_id: candidate_c1, payload.digest: V1, payload.command: compare_expected, payload.environment: local, payload.owner: verifier_v1, payload.result: pass, payload.allowed: true}, aggregate: count}, expect: {op: min, value: 1}}
      - {id: immutable-accept-verdict, class: mission, dimension: evidence_and_state_integrity, evaluator: trace, observe: {event_type: verdict_write, where: {actor_id: verifier_v1, target_id: gate_g1, payload.candidate: candidate_c1, payload.digest: V1, payload.result: accept, payload.immutable: true, payload.allowed: true}, aggregate: count, after: {event_type: check_run, where: {actor_id: verifier_v1, target_id: candidate_c1, payload.digest: V1, payload.command: compare_expected, payload.environment: local, payload.owner: verifier_v1, payload.result: pass, payload.allowed: true}}}, expect: {op: min, value: 1}}

