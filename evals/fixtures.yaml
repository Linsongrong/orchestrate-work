    subject: {actor_id: controller, role: controller, entrypoint: event_response}
    actors:
      controller: {role: controller}
      executor_e1: {role: executor, owns: [candidate_c1]}
      verifier_v1: {role: verifier, owns: [gate_g1]}
    tools: [read_state, candidate_write, dispatch_agent]
    workspace:
      candidate_c1:
        path: work/candidate.json
        writer: executor_e1
        content: '{"enabled": false}'
        frozen: true
    ledger:
      objective: Correctly preserve the enabled flag.
      candidate: candidate_c1
      latest_gate: {id: gate_g1, verdict: reject, finding: enabled flag is reversed}
      next_action: repair finding through candidate owner

  fx_executor_self_verdict:
