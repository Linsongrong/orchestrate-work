schema_version: "2.0"

fixture_defaults:
  network: denied
  credentials: fake
  external_state: instrumented_local_only
  workspace_reset: true
  trace_capture: all_declared_event_types
  durable_namespace: ledger
  attempt_event_defaults: {authorized: true, allowed: true, consumption_delta: 0}
  workspace_metadata: >-
    A workspace object queried by artifact_handoff_check explicitly declares type, size, digest, and
    readable. The stub returns those declared values and does not derive them from host files.

fixtures:
